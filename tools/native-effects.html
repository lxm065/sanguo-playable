<!doctype html><meta charset="utf-8"><canvas id="c"></canvas><script src="/bundle.js"></script><script>
const MV=window.ModelViewer;let viewer,scene,inst,parser,cfg,errors=[];
/** 使用原始模型、粒子和拖尾，按真实依赖地址解析贴图。 */
async function init(c){cfg=c;const canvas=document.querySelector('canvas');canvas.width=canvas.height=c.frameSize;viewer=new MV.viewer.ModelViewer(canvas,{alpha:true,preserveDrawingBuffer:true});viewer.startFrame=function(){const gl=this.gl;gl.depthMask(true);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);};const solve=p=>typeof p==='string'?'/asset/'+p.replace(/\\/g,'/'):p;viewer.on('error',e=>errors.push(String(e.error)+' '+e.fetchUrl));for(const t of ['blp','dds','tga','mdx'])viewer.addHandler(MV.viewer.handlers[t],solve);scene=viewer.addScene();scene.alpha=true;parser=new MV.parsers.mdlx.Model();parser.load(await(await fetch(solve(c.model))).arrayBuffer());parser.eventObjects=parser.eventObjects.filter(e=>!e.name.startsWith('SND'));if(c.particleColors)for(const emitter of parser.particleEmitters2)emitter.segmentColors.forEach((color,i)=>color.set(c.particleColors[i]));if(c.meshColor)for(const g of parser.geosetAnimations){g.color.set(c.meshColor);g.animations=g.animations.filter(a=>a.name!=='KGAC');}if(c.keepMaterials)parser.materials.forEach((m,i)=>{if(!c.keepMaterials.includes(i))for(const l of m.layers){l.alpha=0;l.animations=[];}});if(c.omitParticles){parser.particleEmitters=[];parser.particleEmitters2=[];}const model=await viewer.load(parser,solve);for(let i=0;i<15&&viewer.promiseMap.size;i++)await Promise.allSettled([...viewer.promiseMap.values()]);if(errors.length)throw Error(errors.join(';'));inst=model.addInstance();inst.setScene(scene);inst.setTeamColor(1);model.bounds.fromExtents([-10000,-10000,-10000],[10000,10000,10000]);for(const s of model.sequences)s.bounds.fromExtents([-10000,-10000,-10000],[10000,10000,10000]);const center=[0,0,c.center],d=c.camera,len=Math.hypot(...d),distance=c.radius*3;scene.camera.perspective(Math.PI/4,1,.1,10000);scene.camera.moveToAndFace(center.map((v,k)=>v+d[k]/len*distance),center,[0,0,1]);const seq=parser.sequences.findIndex(s=>s.name.toLowerCase()===(c.sequence||'Birth').toLowerCase());inst.setSequence(seq>=0?seq:0);inst.setSequenceLoopMode((c.loop??(c.sequence==='Stand'))?2:0);return {sequences:parser.sequences.map(s=>({name:s.name,interval:Array.from(s.interval)})),particles:parser.particleEmitters2.length,ribbons:parser.ribbonEmitters.length,textures:parser.textures.map(t=>t.path)};}
/** 顺序推进同一个实例，保留粒子生成、消散和移动拖尾的历史。 */
function frame(index){for(const step of cfg.sequenceTransitions||[])if(index===Math.ceil(step.at*cfg.fps)){const next=parser.sequences.findIndex(s=>s.name.toLowerCase()===step.name.toLowerCase());if(next>=0){inst.setSequence(next);inst.setSequenceLoopMode(0);}}if(cfg.travel){const x=index/cfg.fps*cfg.travel;inst.setLocation([x,0,0]);const center=[x,0,cfg.center],len=Math.hypot(...cfg.camera);scene.camera.moveToAndFace(center.map((v,k)=>v+cfg.camera[k]/len*cfg.radius*3),center,[0,0,1]);}viewer.updateAndRender(1000/cfg.fps);return document.querySelector('canvas').toDataURL('image/png');}
window.api={init,frame};
</script>
