<!doctype html><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script><script type="module">
import * as T from 'three';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
let renderer,scene,camera,model,mixer,clips,span,center;
/** 加载原模型及原动画，固定镜头保证两种贴图逐帧对应。 */
window.init=async(skin,size,actions)=>{renderer=new T.WebGLRenderer({alpha:true,preserveDrawingBuffer:true,antialias:true});renderer.setSize(size,size);renderer.setClearColor(0,0);document.body.appendChild(renderer.domElement);scene=new T.Scene();scene.add(new T.HemisphereLight(0xffffff,0x777788,2));const light=new T.DirectionalLight(0xffffff,2);light.position.set(-2,5,4);scene.add(light);const gltf=await new GLTFLoader().loadAsync('/model/'+skin);model=gltf.scene;scene.add(model);mixer=new T.AnimationMixer(model);clips=gltf.animations;const box=new T.Box3();for(const name of actions){const clip=clips.find(x=>x.name===name);for(let i=0;i<=20;i++){mixer.stopAllAction();mixer.clipAction(clip).play();mixer.setTime(i/21*clip.duration);model.updateMatrixWorld(true);box.union(new T.Box3().setFromObject(model,true));}}center=box.getCenter(new T.Vector3());span=box.getSize(new T.Vector3()).length()*1.08;camera=new T.OrthographicCamera(-span/2,span/2,span/2,-span/2,.1,span*10);return clips.map(x=>({name:x.name,duration:x.duration}));};
/** 固定时间采样完整骨骼动作，方向只转镜头，不改变长枪绑定。 */
window.frame=(name,time,degrees)=>{mixer.stopAllAction();const action=mixer.clipAction(clips.find(x=>x.name===name));action.play();mixer.setTime(time);model.updateMatrixWorld(true);const a=degrees*Math.PI/180;camera.position.set(center.x+Math.sin(a)*span*2,center.y+span*1.4,center.z+Math.cos(a)*span*2);camera.lookAt(center);renderer.render(scene,camera);return renderer.domElement.toDataURL('image/png');};
</script>
